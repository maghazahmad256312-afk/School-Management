<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Management · Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

    <main class="login-card" role="main" aria-labelledby="login-heading">

        <h1 id="login-heading" class="school-title">School Management</h1>

        <div class="logo-wrapper" aria-label="School logo">
            <div class="logo-fallback" aria-hidden="true">
                <i class="fas fa-graduation-cap"></i>
            </div>
        </div>

        <p class="welcome-message">Welcome Back</p>

        <form id="loginForm" novalidate>

            <div class="form-group">
                <label for="email">Username / Email</label>
                <div class="input-wrapper">
                    <input
                        type="text"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="username"
                        aria-required="true"
                        aria-describedby="loginError"
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        aria-required="true"
                        aria-describedby="loginError"
                    >
                </div>
            </div>

            <div class="remember-row">
                <input type="checkbox" id="rememberMe" name="rememberMe">
                <label for="rememberMe">Remember Me</label>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <i class="fas fa-arrow-right-to-bracket" aria-hidden="true"></i>
                Login
            </button>

            <div id="loginError" class="error-message" role="alert" aria-live="polite">
                <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
                <span id="errorText">Invalid email or password.</span>
            </div>

        </form>

        <button type="button" class="forgot-link" id="forgotPasswordBtn">
            Forgot Password?
        </button>

    </main>

    <script src="script.js"></script>
</body>
</html>
