<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Management · Subjects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">


</head>
<body>



    <!-- ============================================= -->
    <!-- TOP HEADER                                    -->
    <!-- ============================================= -->
    <header class="top-header">
        <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">
            <i class="fas fa-bars"></i>
        </button>

        <div class="header-brand">
            <div class="brand-icon"><i class="fas fa-graduation-cap"></i></div>
            <span>School Management</span>
        </div>

        <div class="header-search" role="search">
            <i class="fas fa-search"></i>
            <input type="search" id="globalSearch" placeholder="Search subjects…" aria-label="Search subjects" autocomplete="off">
        </div>

        <div class="header-actions">
            <button class="icon-btn" id="notificationBtn" aria-label="Notifications">
                <i class="far fa-bell"></i>
                <span class="badge-dot" aria-hidden="true"></span>
            </button>

            <div class="admin-profile" id="adminProfile" title="Admin">
                <div class="admin-avatar" id="adminAvatar">
                    <i class="fas fa-user"></i>
                </div>
                <span class="admin-name" id="adminName">Admin</span>
                <input type="file" id="adminProfileFileInput" accept="image/jpeg,image/jpg,image/png,image/webp" style="display:none;" aria-hidden="true">
            </div>

            <div class="profile-dropdown" id="profileDropdown" role="menu" aria-label="Profile menu">
                <div class="profile-dropdown-header">
                    <div class="profile-dropdown-avatar" id="profileDropdownAvatar" role="button" tabindex="0" title="Change photo" aria-label="Change photo">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="profile-dropdown-info">
                        <div class="pd-name" id="pdName">Admin</div>
                        <div class="pd-email" id="pdEmail">—</div>
                        <div class="pd-role" id="pdRole">Administrator</div>
                    </div>
                </div>
                <div class="profile-dropdown-actions">
                    <button type="button" id="pdEditProfile">
                        <i class="fas fa-user-pen"></i> Edit Profile
                    </button>
                    <button type="button" id="pdChangePhoto">
                        <i class="fas fa-camera"></i> Change Photo
                    </button>
                    <button type="button" id="pdLogout" class="pd-logout">
                        <i class="fas fa-right-from-bracket"></i> Logout
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- ============================================= -->
    <!-- SIDEBAR                                       -->
    <!-- ============================================= -->
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
        <ul class="sidebar-menu">
            <li><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
            <li><a href="Students-Page.html"><i class="fas fa-user-graduate"></i> Students</a></li>
            <li><a href="teachers.html"><i class="fas fa-chalkboard-teacher"></i> Teachers</a></li>
            <li><a href="users.html"><i class="fas fa-users"></i> Users</a></li>
            <li><a href="classes.html"><i class="fas fa-school"></i> Classes</a></li>
            <li class="active"><a href="subjects.html"><i class="fas fa-book"></i> Subjects</a></li>
            <li><a href="attendance.html"><i class="fas fa-clipboard-check"></i> Attendance</a></li>
            <li><a href="exams.html"><i class="fas fa-pen-to-square"></i> Exams</a></li>
            <li><a href="results.html"><i class="fas fa-chart-line"></i> Results</a></li>
            <li><a href="fees.html"><i class="fas fa-money-bill-wave"></i> Fees</a></li>
            <li><a href="notices.html"><i class="fas fa-bullhorn"></i> Notices</a></li>
            <li><a href="settings.html"><i class="fas fa-gear"></i> Settings</a></li>
            <li class="logout-item">
                <button type="button" id="logoutBtn">
                    <i class="fas fa-right-from-bracket"></i> Logout
                </button>
            </li>
        </ul>
    </aside>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- ============================================= -->
    <!-- MAIN CONTENT                                  -->
    <!-- ============================================= -->
    <main class="main-content">
        <div class="subjects-header">
            <div class="np-heading-info">
                <div class="np-heading-icon" aria-hidden="true"><i class="fas fa-book"></i></div>
                <div class="np-heading-text">
                    <h1 class="page-title">Subjects</h1>
                    <p class="np-subtitle">Manage subjects and their class allocations.</p>
                </div>
            </div>
            <div class="subjects-header-right">
                <div class="subjects-search">
                    <i class="fas fa-search"></i>
                    <input type="text" id="subjectSearchInput" placeholder="Search subjects by name..." autocomplete="off">
                </div>
                <button type="button" class="btn-primary" id="addSubjectBtn">
                    <i class="fas fa-plus"></i> Add Subject
                </button>
            </div>
        </div>

        <!-- Subjects Cards Grid (populated by JS) -->
        <div class="cards-grid" id="subjectsGrid">
            <!-- Populated by JS -->
        </div>
    </main>

    <!-- ============================================= -->
    <!-- SUBJECT FORM MODAL                            -->
    <!-- ============================================= -->
    <div class="modal-overlay" id="subjectFormModal" role="dialog" aria-modal="true" aria-labelledby="subjectFormTitle">
        <div class="modal">
            <div class="modal-header">
                <h2 id="subjectFormTitle"><i class="fas fa-book"></i> Add New Subject</h2>
                <button type="button" class="modal-close" id="subjectFormClose" aria-label="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="subjectForm" novalidate>
                    <input type="hidden" id="subjectIdHidden">
                    
                    <div class="form-field">
                        <label for="inputSubjectName">Subject Name <span class="req">*</span></label>
                        <input type="text" id="inputSubjectName" name="subjectName" placeholder="e.g. Mathematics" required>
                        <span class="field-error" id="error-subjectName"></span>
                    </div>

                    <div class="form-field">
                        <label for="inputSubjectCode">Subject Code <span class="req">*</span></label>
                        <input type="text" id="inputSubjectCode" name="subjectCode" placeholder="e.g. MATH101" required>
                        <span class="field-error" id="error-subjectCode"></span>
                    </div>

                    <div class="form-field">
                        <label for="inputSubjectClass">Assigned Class <span class="req">*</span></label>
                        <select id="inputSubjectClass" name="subjectClass" required>
                            <option value="">-- Select Class --</option>
                            <option value="5th">5th</option>
                            <option value="6th">6th</option>
                            <option value="7th">7th</option>
                            <option value="8th">8th</option>
                            <option value="9th">9th</option>
                            <option value="10th">10th</option>
                            <option value="11th">11th</option>
                            <option value="12th">12th</option>
                        </select>
                        <span class="field-error" id="error-subjectClass"></span>
                    </div>

                    <div class="form-field">
                        <label for="inputSubjectTeacher">Assigned Teacher <span class="req">*</span></label>
                        <select id="inputSubjectTeacher" name="subjectTeacher" required>
                            <option value="">-- Select Teacher --</option>
                            <!-- Populated dynamically from teachersData -->
                        </select>
                        <span class="field-error" id="error-subjectTeacher"></span>
                    </div>

                    <div class="form-field">
                        <label for="inputSubjectStatus">Status <span class="req">*</span></label>
                        <select id="inputSubjectStatus" name="subjectStatus" required>
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                        <span class="field-error" id="error-subjectStatus"></span>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" id="subjectFormCancel">Cancel</button>
                <button type="submit" form="subjectForm" class="btn-primary" id="subjectFormSubmit">
                    <i class="fas fa-save"></i> Save Subject
                </button>
            </div>
        </div>
    </div>

    <!-- ============================================= -->
    <!-- SUBJECT VIEW MODAL                              -->
    <!-- ============================================= -->
    <div class="modal-overlay" id="viewSubjectModal" role="dialog" aria-modal="true" aria-labelledby="viewSubjectTitle">
        <div class="modal">
            <div class="modal-header">
                <h2 id="viewSubjectTitle"><i class="fas fa-book"></i> Subject Details</h2>
                <button type="button" class="modal-close" id="viewSubjectClose" aria-label="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="details-grid" id="viewSubjectDetails">
                    <!-- Populated by JS -->
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" id="viewSubjectDone">Close</button>
            </div>
        </div>
    </div>

<script src="script.js"></script>
</body>
</html>
